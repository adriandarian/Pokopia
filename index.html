<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokopia Island</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:'Trebuchet MS',system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #hud .pill{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.85);color:#4a3b2a;
    padding:8px 16px;border-radius:999px;font-weight:700;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  #hud .tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.35);
    padding:8px 16px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<div id="hud"><div class="pill" id="score">🌸 0</div><div class="tip">WASD move · Shift run · Space jump · Mouse drag to orbit</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
